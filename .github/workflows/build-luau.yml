name: Build Luau Linux Binaries

on:
  push:
    branches: [main]
    paths:
      - 'core/build_luau.py'
      - '.github/workflows/build-luau.yml'
  workflow_dispatch:

jobs:
  build-luau:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake gcc g++ ninja-build git

      - name: Build patched luau + luau-ast
        run: python3 core/build_luau.py --portable

      - name: Verify binaries
        run: |
          ls -lh bin/luau bin/luau-ast
          bin/luau --version || true

      - name: Commit binaries to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f bin/luau bin/luau-ast
          git diff --staged --quiet && echo "No changes" || git commit -m "ci: built linux luau + luau-ast [skip ci]"
          git push
