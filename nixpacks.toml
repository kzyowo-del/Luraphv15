[phases.setup]
nixPkgs = ["nodejs", "python3", "unzip", "curl"]

[phases.build]
cmds = [
  "npm install",
  "mkdir -p bin",
  "curl -sL https://github.com/luau-lang/luau/releases/download/0.639/luau-ubuntu.zip -o /tmp/luau.zip",
  "unzip -o /tmp/luau.zip -d bin/",
  "chmod +x bin/luau bin/luau-ast",
  "python3 -m venv venv",
  "venv/bin/pip install zstandard",
  "venv/bin/pip install -e luauvmp-engine/luau-vmp-deobf-main"
]

[start]
cmd = "node server.js"
